[build]
  command = "npm install"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Deploy Contexts for Environments
[context.production]
  environment = { NODE_ENV = "production", DEPLOY_ENV = "PROD" }

[context.qa]
  environment = { NODE_ENV = "qa", DEPLOY_ENV = "QA" }

[context.dev]
  environment = { NODE_ENV = "development", DEPLOY_ENV = "DEV" }

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, x-api-key"
